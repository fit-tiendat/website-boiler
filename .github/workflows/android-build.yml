name: Build YHCT Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: yhct-android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yhct-stable-debug-keystore-v1
      - name: Create signing key on first baseline build
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=YHCT Club,O=YHCT,C=VN"
          fi
      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build update-safe APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk yhct-club-v5-update-safe.apk
      - name: Verify APK signature
        run: apksigner verify --verbose yhct-club-v5-update-safe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: yhct-club-v5-update-safe-apk
          path: yhct-club-v5-update-safe.apk
          retention-days: 90
