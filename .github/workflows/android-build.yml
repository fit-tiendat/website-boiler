name: Build YHCT Android V6

on:
  push:
    branches: [ main, v6-web-shell ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yhct-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yhct-stable-debug-keystore-v1
      - name: Ensure stable signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=YHCT Club,O=YHCT,C=VN"
          fi
      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build update-safe APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Package APK
        run: cp app/build/outputs/apk/debug/app-debug.apk yhct-social-v6-update-safe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: yhct-social-v6-update-safe-apk
          path: yhct-social-v6-update-safe.apk
          retention-days: 90
      - name: Publish stable latest APK
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p releases
          cp yhct-social-v6-update-safe.apk releases/yhct-social-latest.apk
          git config user.name "YHCT Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add releases/yhct-social-latest.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to publish"
          else
            git commit -m "chore: publish latest YHCT APK [skip ci]"
            git push origin HEAD:main
          fi
